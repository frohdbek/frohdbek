<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#04201c"/>
    </linearGradient>
    <style>
      text { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 20px; }
      .user { fill: #00ff9c; }
      .cmd { fill: #e6edf3; }
      .out { fill: #ff8c00; }
      .dim { fill: #8b949e; font-size: 14px; }
      .l { opacity: 0; animation: show 0.4s forwards; }
      .l1 { animation-delay: 0.3s; }
      .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 1.7s; }
      .l4 { animation-delay: 2.4s; }
      .l5 { animation-delay: 3.1s; }
      .cursor { animation: blink 1s steps(1) infinite; animation-delay: 3.5s; opacity: 0; }
      @keyframes show { to { opacity: 1; } }
      @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="280" rx="14" fill="url(#bg)" stroke="#30363d"/>

  <!-- Linux (GNOME style) title bar -->
  <rect width="900" height="40" rx="14" fill="#161b22"/>
  <rect y="26" width="900" height="14" fill="#161b22"/>
  <text x="450" y="25" text-anchor="middle" class="dim">frohdbek@archlinux:~</text>

  <!-- window controls on the right -->
  <g stroke="#c9d1d9" stroke-width="1.6" fill="none" stroke-linecap="round">
    <circle cx="805" cy="20" r="11" fill="#30363d" stroke="none"/>
    <line x1="800" y1="24" x2="810" y2="24"/>
    <circle cx="837" cy="20" r="11" fill="#30363d" stroke="none"/>
    <rect x="832" y="15" width="10" height="10" rx="1.5"/>
    <circle cx="869" cy="20" r="11" fill="#30363d" stroke="none"/>
    <line x1="865" y1="16" x2="873" y2="24" stroke="#c9d1d9"/>
    <line x1="873" y1="16" x2="865" y2="24" stroke="#c9d1d9"/>
  </g>

  <g class="l l1"><text x="30" y="85"><tspan class="user">[frohdbek@archlinux ~]$ </tspan><tspan class="cmd">whoami</tspan></text></g>
  <g class="l l2"><text x="30" y="115" class="out">Muhammed Yavuz Açıkmeşe</text></g>
  <g class="l l3"><text x="30" y="155"><tspan class="user">[frohdbek@archlinux ~]$ </tspan><tspan class="cmd">cat focus.txt</tspan></text></g>
  <g class="l l4"><text x="30" y="185" class="out">linux • network security • software architecture</text></g>
  <g class="l l5"><text x="30" y="225"><tspan class="user">[frohdbek@archlinux ~]$ </tspan></text></g>
  <rect class="cursor" x="318" y="209" width="11" height="22" fill="#00ff9c"/>
</svg>
