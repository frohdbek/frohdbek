<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#04201c"/>
    </linearGradient>
    <style>
      text { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; font-size: 20px; }
      .prompt { fill: #00ff9c; }
      .cmd { fill: #e6edf3; }
      .out { fill: #58a6ff; }
      .dim { fill: #8b949e; font-size: 14px; }
      .l { opacity: 0; animation: show 0.4s forwards; }
      .l1 { animation-delay: 0.3s; }
      .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 1.7s; }
      .l4 { animation-delay: 2.4s; }
      .l5 { animation-delay: 3.1s; }
      .cursor { animation: blink 1s steps(1) infinite; animation-delay: 3.5s; opacity: 0; }
      @keyframes show { to { opacity: 1; } }
      @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="900" height="280" rx="14" fill="url(#bg)" stroke="#30363d"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/>
  <rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="26" cy="20" r="7" fill="#ff5f56"/>
  <circle cx="48" cy="20" r="7" fill="#ffbd2e"/>
  <circle cx="70" cy="20" r="7" fill="#27c93f"/>
  <text x="450" y="25" text-anchor="middle" class="dim">frohdbek@homelab: ~</text>

  <g class="l l1"><text x="30" y="85"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text></g>
  <g class="l l2"><text x="30" y="115" class="out">Muhammed Yavuz Açıkmeşe</text></g>
  <g class="l l3"><text x="30" y="155"><tspan class="prompt">$ </tspan><tspan class="cmd">cat focus.txt</tspan></text></g>
  <g class="l l4"><text x="30" y="185" class="out">linux • network security • software architecture</text></g>
  <g class="l l5"><text x="30" y="225"><tspan class="prompt">$ </tspan></text></g>
  <rect class="cursor" x="58" y="209" width="11" height="22" fill="#00ff9c"/>
</svg>
